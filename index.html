/* =========================
   VERSION 48 — UI SYSTEM GLOBAL
   Boutons, typographie, scrollbars invisibles, Profil/Admin
   ========================= */



/* Typographie globale plus stable */
html{
  font-size:15.5px;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{
  line-height:1.5;
}
h1,h2,h3{
  letter-spacing:-.035em;
}
h1{
  font-size:clamp(1.55rem,5vw,2.05rem);
}
h2{
  font-size:clamp(1.28rem,4vw,1.65rem);
}
h3{
  font-size:1.02rem;
}
label{
  font-size:.82rem;
  letter-spacing:-.01em;
}
input,select,textarea{
  font-size:1rem;
  line-height:1.35;
}

/* Boutons V48 : structure homogène */
.btn,
button.btn,
a.btn{
  --btn-bg:#fff;
  --btn-color:var(--text);
  --btn-border:var(--border);
  appearance:none;
  min-height:46px;
  border-radius:16px;
  padding:0 16px;
  border:1px solid var(--btn-border);
  background:var(--btn-bg);
  color:var(--btn-color);
  font-size:.9rem;
  font-weight:900;
  letter-spacing:-.015em;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:center;
  user-select:none;
  white-space:normal;
  line-height:1.15;
  box-shadow:none;
  transition:
    transform .12s ease,
    box-shadow .18s ease,
    background-color .18s ease,
    border-color .18s ease,
    color .18s ease,
    opacity .18s ease;
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 22px rgba(15,23,42,.08);
}
.btn:active{
  transform:translateY(0);
  box-shadow:none;
}
.btn:focus-visible,
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:3px solid rgba(20,184,166,.28);
  outline-offset:2px;
}
.btn:disabled,
.btn[disabled],
button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none!important;
  box-shadow:none!important;
}

.btn-primary{
  --btn-bg:linear-gradient(135deg,var(--primary),#14b8a6);
  --btn-color:#fff;
  --btn-border:rgba(15,118,110,.2);
  width:100%;
  box-shadow:0 12px 24px rgba(15,118,110,.18);
}
.btn-primary:hover{
  box-shadow:0 14px 28px rgba(15,118,110,.24);
}
.btn-secondary{
  --btn-bg:#0f172a;
  --btn-color:#fff;
  --btn-border:#0f172a;
}
.btn-soft{
  --btn-bg:var(--soft);
  --btn-color:var(--dark);
  --btn-border:rgba(15,118,110,.14);
}
.btn-outline{
  --btn-bg:var(--card);
  --btn-color:var(--text);
  --btn-border:var(--border);
}
.btn-danger{
  --btn-bg:#fee2e2;
  --btn-color:#991b1b;
  --btn-border:#fecaca;
}
.btn-success{
  --btn-bg:#dcfce7;
  --btn-color:#166534;
  --btn-border:#bbf7d0;
}
.btn-ghost{
  --btn-bg:transparent;
  --btn-color:var(--muted);
  --btn-border:transparent;
}
.btn-icon{
  width:46px;
  min-width:46px;
  padding:0;
  border-radius:15px;
}
.btn-sm{
  min-height:38px;
  padding:0 12px;
  font-size:.78rem;
  border-radius:13px;
}
.btn-lg{
  min-height:54px;
  padding:0 20px;
  font-size:.96rem;
  border-radius:18px;
}
.btn-block{
  width:100%;
}

/* Éviter les déformations dans les rows */
.row{
  gap:9px;
}
.row .btn{
  min-width:0;
  flex:1 1 135px;
}

/* Navigation basse plus nette */
.bottom{
  height:calc(var(--nav) + 2px);
  padding:8px 10px 12px;
  gap:5px;
}
.nav{
  border-radius:15px;
  min-height:54px;
  transition:background-color .18s ease,color .18s ease,transform .12s ease;
}
.nav:active{
  transform:scale(.97);
}
.nav b{
  font-size:18px;
}

/* Cards et formulaires plus cohérents */
.hero,.card,.form,.item,.empty{
  border-radius:22px;
}
.card,.form,.item{
  color:var(--text);
}
.sub,
.help,
.validation-hint,
.admin-safe-note,
.history-live-note{
  line-height:1.45;
}

/* Profil : tailles, police, lisibilité */
.profile-page .card{
  box-shadow:0 12px 30px rgba(15,23,42,.07);
}
.profile-hero{
  padding:22px 16px 18px;
}
.profile-avatar{
  width:80px;
  height:80px;
  border-radius:26px;
  font-size:1.55rem;
}
.profile-name{
  font-size:clamp(1.35rem,5vw,1.75rem);
  line-height:1.12;
  letter-spacing:-.04em;
  margin-bottom:5px;
}
.profile-email{
  font-size:.83rem;
  line-height:1.35;
}
.profile-section-title h3{
  font-size:1rem;
  letter-spacing:-.025em;
}
.profile-info-row{
  padding:12px;
  border-radius:17px;
}
.profile-info-row b{
  font-size:.9rem;
  line-height:1.25;
}
.profile-info-row span{
  font-size:.76rem;
  line-height:1.35;
}
.profile-info-icon{
  width:36px;
  height:36px;
  border-radius:13px;
}

/* Admin : meilleure hiérarchie et lisibilité */
.admin-mobile-id,
.admin-card-title{
  font-size:.86rem;
  line-height:1.28;
}
.admin-mobile-amount{
  font-size:clamp(1.05rem,4vw,1.35rem);
  line-height:1.15;
}
.admin-mobile-route,
.admin-card-details .sub{
  font-size:.78rem;
}
.admin-tabs{
  gap:7px;
  padding:6px;
  scroll-behavior:smooth;
}
.admin-tab{
  font-size:.8rem;
  min-height:40px;
}
.admin-tool-card b,
.admin-export-row b,
.admin-sticky-title{
  font-size:.92rem;
}
.admin-tool-card span,
.admin-export-row .sub{
  font-size:.78rem;
}
.admin-action-strip .btn,
.admin-mini-actions .btn,
.admin-receipt-actions .btn{
  min-height:39px;
  border-radius:13px;
  font-size:.76rem;
}
.admin-filter-label{
  font-size:.76rem;
}
.admin-list-count,
.history-count{
  font-size:.72rem;
}

/* Mini stats */
.mini{
  border-radius:18px;
  padding:13px;
}
.mini strong{
  font-size:clamp(1rem,4vw,1.28rem);
  line-height:1.15;
  word-break:break-word;
}
.mini span{
  font-size:.75rem;
  line-height:1.35;
}

/* Badges */
.pill{
  font-size:.68rem;
  min-height:25px;
  padding:6px 9px;
  line-height:1.1;
}

/* Inputs plus confortables */
input,select,textarea{
  min-height:48px;
  border-radius:16px;
}
textarea{
  padding-top:13px;
}

/* Reçus / détail transfert */
.receipt{
  border-radius:22px;
}
.receipt-box{
  border-radius:16px;
}

/* Dark mode V48 */
body.dark .btn-outline{
  --btn-bg:#111827;
  --btn-color:#f8fafc;
  --btn-border:#334155;
}
body.dark .btn-ghost{
  --btn-bg:transparent;
  --btn-color:#cbd5e1;
  --btn-border:transparent;
}
body.dark .btn-secondary{
  --btn-bg:#f8fafc;
  --btn-color:#0f172a;
  --btn-border:#f8fafc;
}
body.dark .admin-tab.active,
body.dark .btn-primary{
  color:#fff;
}
body.dark .mini,
body.dark .card,
body.dark .form,
body.dark .item,
body.dark .empty{
  box-shadow:0 12px 30px rgba(0,0,0,.20);
}

/* Petits écrans */
@media(max-width:420px){
  html{
    font-size:15px;
  }
  .content{
    padding:12px 12px calc(var(--nav) + 20px);
  }
  .hero{
    padding:19px 16px;
    margin-bottom:14px;
  }
  .btn{
    min-height:45px;
    font-size:.86rem;
  }
  .row{
    gap:8px;
  }
  .row .btn{
    flex-basis:100%;
  }
  .grid2,
  .grid3,
  .receipt-grid,
  .phase-d-grid,
  .admin-tool-grid{
    gap:9px;
  }
  .admin-action-strip{
    grid-template-columns:1fr;
  }
}

/* Réduction animation si utilisateur préfère */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important;
  }
}


/* =========================
   VERSION 50 — COMPTE / PROFIL / FAVORIS
   Scrollbars invisibles mais scroll actif + montants admin réduits
   ========================= */



/* Admin : réduire la taille des montants */
.admin-page .mini strong,
.admin-page .admin-drill-summary .mini strong,
.admin-page .admin-tool-card strong{
  font-size:.88rem!important;
  line-height:1.22!important;
  letter-spacing:-.025em!important;
}
.admin-page .admin-mobile-amount,
.admin-mobile-amount{
  font-size:.95rem!important;
  line-height:1.18!important;
  letter-spacing:-.025em!important;
  word-break:break-word;
}
.admin-page .mini{
  padding:11px!important;
}
.admin-page .mini span{
  font-size:.70rem!important;
}
.admin-page .ititle,
.admin-page .admin-card-title,
.admin-page .admin-mobile-id{
  font-size:.82rem!important;
}

/* Profil/Admin : lisibilité finale V50 */
.profile-page .profile-name{
  font-size:1.35rem!important;
}
.profile-page .profile-section-title h3,
.admin-page .section{
  font-size:.98rem!important;
}
.profile-page .profile-info-row b{
  font-size:.86rem!important;
}

/* Welcome card */
.welcome-hint{
  padding:12px;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(20,184,166,.08),transparent),var(--card);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:.8rem;
  line-height:1.45;
  margin-top:12px;
}
body.dark .welcome-hint{
  background:#0b1220;
}


/* =========================
   VERSION 52 — RESTAURATION SCROLLBARS NATIVES
   Toutes les modifications précédentes liées aux barres de défilement sont neutralisées.
   Le navigateur reprend son comportement normal.
   ========================= */

*{
  scrollbar-width:auto!important;
  scrollbar-color:auto!important;
}

*::-webkit-scrollbar{
  display:initial!important;
  width:initial!important;
  height:initial!important;
}

*::-webkit-scrollbar-track{

function syncState(eventName="change",payload={}){
  state.sync=state.sync||{changes:0};
  state.sync.lastChange={event:eventName,payload,time:new Date().toISOString()};
  state.sync.changes=Number(state.sync.changes||0)+1;
  if(typeof updateVisibleLivePreviews==="function")updateVisibleLivePreviews();
  return state.sync.lastChange
}
function autoDetectTransferChange(field,value){
  state.transfer=state.transfer||{};
  state.transfer[field]=value;
  syncState(`transfer.${field}`,{value});
  if(field==="direction"){
    state.transfer.senderOption=null;
    state.transfer.recipientOption=null;
    refreshRate(value,false).then(()=>updateTransferAmountPreview());
  }else if(field==="amount") updateTransferAmountPreview();
  else if(typeof safeRender==="function")safeRender();else render();
}

function welcomeForUser(u,created=false){
  if(!u)return"Bienvenue sur Flick-exchange.";
  if(u.role==="admin"){
    let declared=getTransfers().filter(t=>t.status===ST.DECLARED).length;
    return created
      ? `Bienvenue Admin ${u.firstName}. Votre compte administrateur est prêt.`
      : `Bienvenue Admin ${u.firstName}. ${declared?declared+" paiement(s) déclaré(s) à vérifier.":"Aucune demande urgente pour le moment."}`;
  }
  return created
    ? `Bienvenue sur Flick-exchange, ${u.firstName} ! Votre compte a été créé avec succès.`
    : `Bon retour, ${u.firstName} !`;
}

function normalizeTextKey(value){return String(value||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ")}
function normalizedFavoriteData(data){
  let country=data.country||"BJ",phone=country==="BJ"?fmtBJ(data.phone):fmtRU(data.phone);
  return {
    firstName:normalizeTextKey(data.firstName),
    lastName:normalizeTextKey(data.lastName),
    country,
    phone,
    method:normalizeTextKey(country==="BJ"?(data.network||data.methodName):(data.bankName||data.customBankName||data.methodName))
  }
}
function sameFavoriteInfo(a,b){
  let x=normalizedFavoriteData(a),y=normalizedFavoriteData(b);
  let samePhoneCountry=x.country===y.country&&x.phone===y.phone;
  let sameStrict=samePhoneCountry&&x.firstName===y.firstName&&x.lastName===y.lastName&&x.method===y.method;
  return samePhoneCountry||sameStrict;
}
function favoriteDuplicateReason(fav,excludeId=null){
  let u=getCurrentUser();
  let existing=(u&&u.favorites||[]).find(x=>x.id!==excludeId&&sameFavoriteInfo(normalizeFavorite(x),fav));
  if(!existing)return null;
  let nf=normalizeFavorite(existing);
  if(nf.phone===(fav.country==="BJ"?fmtBJ(fav.phone):fmtRU(fav.phone))&&nf.country===fav.country){
    return `Ce favori existe déjà avec le numéro ${nf.phone}.`;
  }
  return "Ce favori existe déjà avec les mêmes informations.";
}

const AUDIT_KEY="fx_audit_logs_v1";
function getAuditLogs(){return read(AUDIT_KEY,[])}
function saveAuditLogs(v){write(AUDIT_KEY,Array.isArray(v)?v:[])}
function auditAction(action,label,details={}){
  try{
    let u=getCurrentUser&&getCurrentUser(),entry={
      id:id("aud"),
      action,
      label,
      details,
      userId:u&&u.id,
      userName:u?`${u.firstName} ${u.lastName}`:"Visiteur",
      role:u&&u.role,
      route:typeof route==="function"?route():location.hash,
      createdAt:new Date().toISOString()
    };
    saveAuditLogs([entry,...getAuditLogs()].slice(0,300));
    return entry
  }catch(e){console.warn("auditAction failed",e)}
}
function auditLabel(entry){return `${entry.userName||"Utilisateur"} • ${entry.role||"role"} • ${rel(entry.createdAt)}`}
function exportAuditCSV(){
  let head="ID,Date,Action,Libellé,Utilisateur,Rôle,Route";
  let rows=getAuditLogs().map(a=>[a.id,fdate(a.createdAt),a.action,a.label,a.userName,a.role,a.route]);
  let csv=[head,...rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  download("flick-exchange-audit-local.csv",csv,"text/csv");
  auditAction("audit_export","Export du journal local")
}
function clearAuditLogs(){
  if(!confirm("Vider le journal d’audit local ?"))return;
  saveAuditLogs([]);
  showToast("success","Journal d’audit vidé.");
  render()
}
function renderAuditPanel(limit=12){
  let u=getCurrentUser();
  if(!u||u.role!=="admin")return"";
  let logs=getAuditLogs();
  return `<section class="card audit-card" style="margin-top:16px"><div class="profile-section-title"><div><h3>🧾 Journal local d’audit</h3><p class="sub">Actions sensibles enregistrées localement pour faciliter le suivi avant backend.</p></div><span class="pill p-warning">${logs.length}</span></div><div class="row"><button type="button" class="btn btn-outline" onclick="exportAuditCSV()">Exporter CSV</button><button type="button" class="btn btn-danger" onclick="clearAuditLogs()">Vider</button></div><div class="audit-list">${logs.slice(0,limit).length?logs.slice(0,limit).map(a=>`<article class="audit-item"><b>${esc(a.label||a.action)}</b><span>${esc(auditLabel(a))}</span><span>${esc(a.route||"")}</span></article>`).join(""):empty("Aucune action auditée","Les actions sensibles apparaîtront ici.")}</div></section>`
}
function applyAccessibilityEnhancements(){
  document.querySelectorAll("button").forEach(btn=>{
    if(!btn.getAttribute("aria-label")){
      let label=(btn.innerText||btn.textContent||"Action").trim().replace(/\s+/g," ");
      btn.setAttribute("aria-label",label||"Action")
    }
  });
  document.querySelectorAll("a.btn").forEach(a=>{
    if(!a.getAttribute("role"))a.setAttribute("role","button")
  });
  document.querySelectorAll("input,select,textarea").forEach(el=>{
    if(!el.getAttribute("aria-label")){
      let group=el.closest(".group"),label=group&&group.querySelector("label");
      if(label)el.setAttribute("aria-label",label.textContent.trim())
    }
  });
}

function preserveFocusAfter(callback){
  let active=document.activeElement;
  let id=active&&active.id;
  let name=active&&active.name;
  let start=active&&typeof active.selectionStart==="number"?active.selectionStart:null;
  let end=active&&typeof active.selectionEnd==="number"?active.selectionEnd:null;
  callback();
  requestAnimationFrame(()=>{
    let next=(id&&document.getElementById(id))||(name&&document.querySelector(`[name="${name}"]`));
    if(next&&typeof next.focus==="function"){
      next.focus();
      if(start!==null&&typeof next.setSelectionRange==="function"){
        try{next.setSelectionRange(start,end)}catch(e){}
      }
    }
  })
}
function cleanPhoneDigits(value){return digits(value)}
function normalizeBJPhoneInput(value){
  let d=cleanPhoneDigits(value);
  if(d.startsWith("229"))d=d.slice(3);
  if(d.startsWith("01"))d=d.slice(2);
  d=d.slice(0,8);
  let parts=d.match(/.{1,2}/g)||[];
  return "+229 01 "+parts.join(" ")
}
function normalizeRUPhoneInput(value){
  let d=cleanPhoneDigits(value);
  if(d.startsWith("8"))d=d.slice(1);
  if(d.startsWith("7"))d=d.slice(1);
  d=d.slice(0,10);
  let a=d.slice(0,3),b=d.slice(3,6),c=d.slice(6,8),e=d.slice(8,10);
  return "+7 "+[a,b,c,e].filter(Boolean).join(a&&b&&c?"-":" ")
}
function formatPhoneInput(input,country){
  let before=input.value;
  input.value=country==="BJ"?normalizeBJPhoneInput(before):normalizeRUPhoneInput(before);

function useFav(fid){let u=getCurrentUser(),f=(u.favorites||[]).find(x=>x.id===fid);if(!f)return;state.transfer.ruName=f.fullName||"";state.transfer.ruPhone=f.phone||"";state.transfer.bank=f.bankName||"";state.transfer.bjFirst=f.firstName||"";state.transfer.bjLast=f.lastName||"";state.transfer.bjPhone=f.phone||"";msg("success","Favori appliqué.");render()}

function updateTransfer(tid,patch){let target=null;saveTransfers(getTransfers().map(t=>{if(t.id!==tid)return t;target={...t,...patch,updatedAt:new Date().toISOString()};return target}));return target}
function declarePayment(tid){let t=updateTransfer(tid,{status:ST.DECLARED,paymentDeclaredAt:new Date().toISOString()});if(t){notifyUser(t.userId,"Paiement déclaré",`Paiement déclaré pour le transfert ${t.id}.`,"transfer",t.id);notifyAdmins("Paiement déclaré à vérifier",`L’utilisateur a déclaré le paiement : ${transferNotificationSummary(t)}.`,"admin_payment_declared",t.id,{priority:"high"});auditAction("payment_declared",`Paiement déclaré ${t.id}`,{transferId:t.id})}render()}
function uploadProof(tid,input){let file=input.files&&input.files[0];if(!file)return;let u=getCurrentUser();let r=new FileReader();r.onload=()=>{let t=transferById(tid);if(!t)return msg("error","Transfert introuvable.");let proofs=t.paymentProofs||[];let proof={id:id("proof"),type:file.type&&file.type.includes("pdf")?"pdf":file.type&&file.type.includes("image")?"image":"other",name:file.name,dataUrl:r.result,uploadedAt:new Date().toISOString(),uploadedBy:u&&u.id,uploadedByName:u?`${u.firstName} ${u.lastName}`:"Utilisateur",source:"payment_proof",statusAtUpload:t.status};let updated=updateTransfer(tid,{paymentProofs:[...proofs,proof],lastProofUploadedAt:new Date().toISOString()});if(updated){notifyAdmins("Preuve ajoutée",`Une preuve a été ajoutée au transfert ${transferNotificationSummary(updated)}.`,"admin_proof_uploaded",updated.id,{priority:"info"});notifyUser(updated.userId,"Preuve ajoutée",`Votre preuve de paiement a été ajoutée au transfert ${updated.id}.`,"transfer",updated.id);auditAction("proof_uploaded",`Preuve ajoutée ${updated.id}`,{transferId:updated.id,proofName:file.name})}msg("success","Preuve ajoutée à la demande de transfert.");input.value="";render()};r.readAsDataURL(file)}

function countdownParts(deadline){let ms=new Date(deadline).getTime()-Date.now();if(!deadline||Number.isNaN(ms))return{expired:true,text:"Délai inconnu",ms:0};if(ms<=0)return{expired:true,text:"Temps expiré",ms:0};let m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);return{expired:false,text:`${m} min ${String(s).padStart(2,"0")} sec`,ms}}
function stopTransferCountdown(){if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}}
function updateCountdownDom(tid){let t=transferById(tid);let el=document.getElementById("liveCountdown");let status=document.getElementById("detailStatusBadge");let actions=document.getElementById("paymentActionZone");if(!t||!el)return stopTransferCountdown();let p=countdownParts(t.paymentDeadlineAt);el.textContent=t.status===ST.PENDING?p.text:statusLabel(t.status);if(status){status.textContent=statusLabel(t.status);status.className=`pill ${statusClass(t.status)}`;}if(t.status===ST.PENDING&&p.expired){updateTransfer(t.id,{status:ST.EXPIRED,expiredAt:new Date().toISOString()});showToast("warning",`Le transfert ${t.id} a expiré.`);if(actions)actions.innerHTML='<div class="alert err">Délai expiré. Paiement impossible sur cette demande.</div>';stopTransferCountdown();render();return}if(t.status!==ST.PENDING)stopTransferCountdown()}
function startTransferCountdown(tid){stopTransferCountdown();let t=transferById(tid);if(!t||t.status!==ST.PENDING)return;updateCountdownDom(tid);countdownTimer=setInterval(()=>updateCountdownDom(tid),1000)}


function transferIsNearExpiration(t){
  if(t.status!==ST.PENDING||!t.paymentDeadlineAt)return false;
  let left=new Date(t.paymentDeadlineAt).getTime()-Date.now();
  return left>0&&left<5*60*1000
}
function transferStatusDescription(t){
  let map={
    [ST.PENDING]:"Le transfert est créé. L’utilisateur doit effectuer le paiement et peut ajouter une preuve.",
    [ST.DECLARED]:"L’utilisateur a déclaré avoir payé. L’administrateur doit vérifier le paiement.",
    [ST.PAID]:"Le paiement a été confirmé. Le transfert peut être finalisé vers le destinataire.",
    [ST.PROCESSING]:"Le transfert est en traitement.",
    [ST.COMPLETED]:"L’envoi final a été confirmé. Le transfert est terminé.",
    [ST.CANCELLED]:"Le transfert a été annulé.",
    [ST.EXPIRED]:"Le délai de paiement est dépassé."
  };
  return map[t.status]||"Statut non reconnu."
}
function transferPriorityBadges(t){
  let badges=[];
  if(t.status===ST.DECLARED)badges.push(`<span class="pill p-warning priority-badge">Urgent</span>`,`<span class="pill p-warning priority-badge">À vérifier</span>`);
  if(transferIsNearExpiration(t))badges.push(`<span class="pill p-danger priority-badge">Expire bientôt</span>`);
  if(t.status===ST.COMPLETED)badges.push(`<span class="pill p-success priority-badge">Terminé</span>`);
  if(t.status===ST.CANCELLED)badges.push(`<span class="pill p-danger priority-badge">Annulé</span>`);
  if(t.status===ST.EXPIRED)badges.push(`<span class="pill p-danger priority-badge">Expiré</span>`);
  if(hasTransferProof(t))badges.push(`<span class="pill p-info priority-badge">Avec preuve</span>`);
  else badges.push(`<span class="pill p-warning priority-badge">Sans preuve</span>`);
  badges.push(`<span class="pill ${statusClass(t.status)} priority-badge">${statusLabel(t.status)}</span>`);
  return `<div class="priority-row">${badges.join("")}</div>`
}
function timelineDotClass(done,type){
  if(type==="danger")return"timeline-dot danger";
  if(type==="warn")return"timeline-dot warn";
  if(type==="success")return"timeline-dot success";
  return done?"timeline-dot done":"timeline-dot"
}

function ensureDetailOpen(){if(!state.detailOpen)state.detailOpen={timeline:true,receipt:true};return state.detailOpen}
function isDetailOpen(key){let o=ensureDetailOpen();return o[key]!==false}
function toggleDetailSection(key){let o=ensureDetailOpen();o[key]=!isDetailOpen(key);if(typeof safeRender==="function")safeRender();else render()}
function senderPaymentMethod(t){return (t.senderParty&&t.senderParty.methodName)||(t.senderInfo&&t.senderInfo.methodName)||t.senderMethod||t.senderBank||""}
function recipientPaymentMethod(t){let r=t.recipient||{};return r.methodName||r.network||r.bankName||r.customBankName||""}
function proofOwnerLabel(p){return p.uploadedByName?`Ajouté par ${esc(p.uploadedByName)}`:"Preuve utilisateur"}
function proofCanDelete(t,p){let u=getCurrentUser();return !!u&&(u.role==="admin"||t.userId===u.id)}
function deleteProof(tid,pid){let t=transferById(tid),u=getCurrentUser();if(!t)return;let proof=(t.paymentProofs||[]).find(p=>p.id===pid);if(!proof)return msg("error","Preuve introuvable.");if(!proofCanDelete(t,proof))return msg("error","Vous ne pouvez pas supprimer cette preuve.");if(!confirm("Supprimer cette preuve de paiement ?"))return;let next=(t.paymentProofs||[]).filter(p=>p.id!==pid),updated=updateTransfer(tid,{paymentProofs:next,proofDeletedAt:new Date().toISOString()});if(updated){notifyAdmins("Preuve supprimée",`Une preuve a été supprimée du transfert ${transferNotificationSummary(updated)}.`,"admin_proof_deleted",updated.id,{priority:"warning"});notifyUser(updated.userId,"Preuve supprimée",`Une preuve a été supprimée du transfert ${updated.id}.`,"transfer",updated.id);auditAction("proof_deleted",`Preuve supprimée ${updated.id}`,{transferId:updated.id,proofId:pid})}msg("success","Preuve supprimée.");render()}
function proofListHtml(t){let proofs=t.paymentProofs||[];return proofs.length?`<div class="proof-list">${proofs.map(p=>`<div class="proof-thumb"><div class="ititle">${esc(p.name)}</div><p class="sub">${esc(p.type)} • ${fdate(p.uploadedAt)} • ${proofOwnerLabel(p)}</p><div class="proof-badge-row"><span class="pill p-info">${esc(p.source||"payment_proof")}</span><span class="pill ${p.statusAtUpload===ST.DECLARED?"p-warning":"p-primary"}">${statusLabel(p.statusAtUpload||t.status)}</span></div>${p.type==="image"?`<img src="${p.dataUrl}" alt="Preuve de paiement">`:`<div class="receipt-extra-note">Fichier ${esc(p.type)} disponible dans cette preuve.</div>`}${proofCanDelete(t,p)?`<div class="proof-actions"><button type="button" class="btn btn-danger" onclick="deleteProof('${t.id}','${p.id}')" title="Supprimer la preuve">🗑️ Supprimer</button></div>`:""}</div>`).join("")}</div>`:empty("Aucune preuve","Vous pouvez ajouter une capture ou une photo après paiement.")}
function receiptPanel(t){let open=isDetailOpen("receipt"),icon=open?"⌃":"⌄";return`<section class="receipt-panel-card"><div class="receipt-panel-actions no-print"><button type="button" class="btn btn-outline" onclick="printReceipt('${t.id}')">📄 PDF</button><button type="button" class="btn btn-soft" onclick="downloadReceiptImage('${t.id}')">🖼️ Image</button><button type="button" class="btn btn-primary" onclick="shareReceipt('${t.id}')">📤 Partager</button></div><div class="collapsible-body ${open?"":"is-collapsed"}">${receiptHtml(t)}</div></section>`}

function transferTimelineEvents(t){
  if(t.status===ST.EXPIRED){
    return [
      {title:"Transfert créé",desc:"La demande a été enregistrée.",date:t.createdAt,done:true,icon:"1"},
      {title:"Délai expiré",desc:"Le temps de paiement autorisé est dépassé. Les étapes de paiement et d’envoi final ne sont plus affichées.",date:t.expiredAt||t.updatedAt,done:true,icon:"!",type:"danger"}
    ]
  }
  if(t.status===ST.CANCELLED){
    return [
      {title:"Transfert créé",desc:"La demande a été enregistrée.",date:t.createdAt,done:true,icon:"1"},
      {title:"Transfert annulé",desc:t.cancellationReason?`Raison : ${t.cancellationReason}`:"Le transfert a été annulé.",date:t.updatedAt,done:true,icon:"!",type:"danger"}
    ]
  }
  let paymentDone=[ST.DECLARED,ST.PAID,ST.PROCESSING,ST.COMPLETED].includes(t.status);
  let paymentConfirmed=[ST.PAID,ST.PROCESSING,ST.COMPLETED].includes(t.status)||!!(t.steps&&t.steps.paymentReceived);
  let finalDone=t.status===ST.COMPLETED&&!!(t.steps&&t.steps.paymentReceived);
  return [
    {title:"Transfert créé",desc:"La demande a été enregistrée.",date:t.createdAt,done:true,icon:"1"},
    {title:"Paiement déclaré",desc:"L’utilisateur signale avoir effectué le paiement.",date:t.paymentDeclaredAt||null,done:paymentDone,icon:"2"},
    {title:"Paiement confirmé",desc:"L’admin confirme la réception complète du paiement.",date:t.paymentConfirmedAt||([ST.PAID,ST.PROCESSING,ST.COMPLETED].includes(t.status)?t.updatedAt:null),done:paymentConfirmed,icon:"3"},
    {title:"Traitement",desc:"Le transfert est en cours d’envoi vers le destinataire.",date:t.processingAt||(t.status===ST.PROCESSING?t.updatedAt:null),done:[ST.PROCESSING,ST.COMPLETED].includes(t.status),icon:"4"},
    {title:"Envoi final confirmé",desc:"Cette étape devient verte uniquement lorsque le transfert est totalement terminé.",date:t.finalSentAt||(finalDone?t.updatedAt:null),done:finalDone,icon:"✓",type:finalDone?"success":null}
  ]
}
function transferTimeline(t){
  let events=transferTimelineEvents(t),open=isDetailOpen("timeline"),icon=open?"⌃":"⌄";
  return `<section class="card timeline-card no-print"><div class="collapsible-head clean"><div><h3>🕒 Timeline du transfert</h3><p class="sub">${transferStatusDescription(t)}</p><div class="status-help">${transferPriorityBadges(t)}${transferStatusDescription(t)}</div><div class="timeline-list ${open?"":"is-collapsed"}">${events.map(e=>`<div class="timeline-item"><div class="${timelineDotClass(e.done,e.type)}">${e.icon}</div><div class="timeline-content"><b>${esc(e.title)}</b><span>${esc(e.desc)}</span><span>${e.date?fdate(e.date):(e.done?"Date non enregistrée":"En attente")}</span></div></div>`).join("")}</div></section>`
}

|0)+Number(t.fees||0),t.currencyFrom)}')"><span>Copier montant</span><b>${money(t.totalToPay||Number(t.amountSent||0)+Number(t.fees||0),t.currencyFrom)}</b></button><button type="button" class="btn btn-outline copy" onclick="copyText('${esc(t.id)}')"><span>Copier référence</span><b>${esc(t.id)}</b></button></div><h3 class="section">Après paiement</h3><div class="form"><div class="group"><label>Ajouter une preuve visuelle ou PDF</label><input type="file" accept="image/*,.pdf" onchange="uploadProof('${t.id}',this)"><small class="help">La preuve est attachée à ce transfert et peut être supprimée en cas d’erreur.</small></div>${canPay?`<button type="button" class="btn btn-primary" onclick="declarePayment('${t.id}')">J'ai effectué le paiement</button>`:`<div class="alert inf">Paiement déjà déclaré, confirmé, terminé ou expiré.</div>`}</div><h3 class="section">Preuves ajoutées <small>${proofs.length}</small></h3>${proofListHtml(t)}<div class="row" style="margin-top:14px"><a class="btn btn-outline" href="${ROUTES.HISTORY}">↩️ Historique</a><button type="button" class="btn btn-warning" onclick="openClaim(\'${t.id}\')">⚠️ Réclamation</button></div></div></section>`}

function adminCSVRows(list){
  return list.map(t=>[
    t.id,
    fdate(t.createdAt),
    t.userName,
    t.direction,
    t.senderName,
    t.senderPhone,
    t.recipient&&t.recipient.fullName,
    t.recipient&&t.recipient.phone,
    t.amountSent,
    t.currencyFrom,
    t.amountReceived,
    t.currencyTo,
    statusLabel(t.status),
    t.fees,
    hasTransferProof(t)?"Oui":"Non"
  ])
}
function exportAdminCSVList(list,name="admin-transferts-flick-exchange.csv"){
  let head="ID,Date,Utilisateur,Direction,Expéditeur,Téléphone expéditeur,Destinataire,Téléphone destinataire,Montant envoyé,Devise source,Montant reçu,Devise cible,Statut,Frais,Preuve";
  let csv=[head,...adminCSVRows(list).map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  download(name,csv,"text/csv");auditAction("csv_export",`Export CSV ${name}`,{rows:list.length})
}
function exportAdminByStatus(status){
  let list=status==="all"?getTransfers():getTransfers().filter(t=>t.status===status);
  exportAdminCSVList(list,`admin-transferts-${status}.csv`)
}
function exportAdminByCurrency(currency){
  let list=getTransfers().filter(t=>t.currencyFrom===currency||t.currencyTo===currency);
  exportAdminCSVList(list,`admin-transferts-${currency}.csv`)
}
function exportAdminByProof(type){
  let list=type==="with"?getTransfers().filter(hasTransferProof):getTransfers().filter(t=>!hasTransferProof(t));
  exportAdminCSVList(list,`admin-transferts-${type==="with"?"avec-preuve":"sans-preuve"}.csv`)
}

function filterAdminTransfers(type,value){
  let list=getTransfers().slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!type||value==="all")return list;
  if(type==="status")return list.filter(t=>t.status===value);
  if(type==="currency")return list.filter(t=>t.currencyFrom===value||t.currencyTo===value);
  if(type==="sentCurrency")return list.filter(t=>t.currencyFrom===value);
  if(type==="receivedCurrency")return list.filter(t=>t.currencyTo===value);
  if(type==="feeCurrency")return list.filter(t=>t.currencyFrom===value&&Number(t.fees||0)>0);
  if(type==="proof")return value==="with"?list.filter(hasTransferProof):list.filter(t=>!hasTransferProof(t));
  if(type==="alert")return list.filter(t=>t.status===ST.DECLARED||t.status===ST.PENDING);
  if(type==="user")return list.filter(t=>t.userId===value);
  return list
}

  let open=state.adminQuickOpen===t.id,
      a=t.adminPaymentAccount||adminAccountForSource(t.sourceCountry||sourceCountry(t.direction)),
      proofs=t.paymentProofs||[];
  return`<article class="item admin-card compact" onclick="toggleAdminQuickDetails('${t.id}')">
    <div class="admin-mobile-top">
      <div>
        <div class="admin-mobile-id">${esc(t.id)} • ${esc(t.userName||t.senderName||"Utilisateur")}</div>
        <div class="admin-mobile-amount">${money(t.amountSent,t.currencyFrom)} → ${money(t.amountReceived,t.currencyTo)}</div>
        <div class="admin-mobile-route">${esc(t.direction||"")} • ${esc(t.senderName||"")} → ${esc(t.recipient&&t.recipient.fullName||"")}</div>
      </div>
      <span class="pill ${statusClass(t.status)}">${statusLabel(t.status)}</span>
    </div>

    <div class="admin-card-meta">
      ${adminPriorityBadge(t)}
      <span class="pill ${hasTransferProof(t)?"p-success":"p-warning"}">${hasTransferProof(t)?"Avec preuve":"Sans preuve"}</span>
      <span class="pill p-primary">${esc(t.currencyFrom)} / ${esc(t.currencyTo)}</span>
    </div>

    ${adminQuickActions(t)}

    ${open?`<div class="admin-card-details">
      <p class="sub"><b>Créé :</b> ${fdate(t.createdAt)}</p>
      <p class="sub"><b>Deadline :</b> ${t.paymentDeadlineAt?fdate(t.paymentDeadlineAt):"Non définie"}</p>
      <p class="sub"><b>Expéditeur :</b> ${esc(t.senderName||"")} — ${esc(t.senderPhone||"")}</p>
      <p class="sub"><b>Destinataire :</b> ${esc(t.recipient&&t.recipient.fullName||"")} — ${esc(t.recipient&&t.recipient.phone||"")}</p>
      <p class="sub"><b>Compte réception :</b> ${esc(a.methodName||"")} — ${esc(a.phone||a.cardOrAccount||"")}</p>
      <p class="sub"><b>Frais :</b> ${money(t.fees,t.currencyFrom)} • <b>Preuves :</b> ${proofs.length}</p>
      <div class="status-help">${transferStatusDescription(t)}</div>
      ${t.cancellationReason?`<div class="alert err">Raison annulation : ${esc(t.cancellationReason)}</div>`:""}
      <div class="admin-mini-actions">
        <a class="btn btn-outline" onclick="event.stopPropagation()" href="${ROUTES.TRANSFER_DETAIL}?id=${encodeURIComponent(t.id)}">Ouvrir page détail</a>
        <button type="button" class="btn btn-soft" onclick="event.stopPropagation();shareReceipt('${t.id}')">Partager reçu</button>
      </div>
    </div>`:`<p class="admin-empty-help">Cliquez sur la carte pour afficher un résumé rapide.</p>`}
  </article>`
}

function receiptStatusStyle(status){return status===ST.COMPLETED?"background:#dcfce7;color:#166534":status===ST.CANCELLED||status===ST.EXPIRED?"background:#fee2e2;color:#991b1b":"background:#dbeafe;color:#1e40af"}
function receiptHtml(t){let a=t.adminPaymentAccount||adminAccountForSource(t.sourceCountry||sourceCountry(t.direction)),proofs=t.paymentProofs||[];return`<section class="receipt" id="receiptPrintable"><div class="receipt-top-band"><div class="receipt-head"><div style="display:flex;gap:12px;align-items:center"><div class="receipt-logo">FX</div><div class="receipt-company"><h2>${APP_CONFIG.companyName}</h2><p>Reçu officiel de transfert international<br>Bénin ↔ Russie</p></div></div><span class="receipt-status" style="${receiptStatusStyle(t.status)}">${statusLabel(t.status)}</span></div></div><div class="receipt-body"><div class="receipt-grid"><div class="receipt-box"><b>Numéro de transfert</b><span>${esc(t.id)}</span></div><div class="receipt-box"><b>Date de création</b><span>${fdate(t.createdAt)}</span></div><div class="receipt-box"><b>Expéditeur</b><span>${esc(t.senderName)}<br>${esc(t.senderPhone)}${senderPaymentMethod(t)?`<br>Réseau / banque : ${esc(senderPaymentMethod(t))}`:""}</span></div><div class="receipt-box"><b>Destinataire</b><span>${esc(t.recipient.fullName)}<br>${esc(t.recipient.phone)}<br>${esc(t.recipient.network||t.recipient.bankName||t.recipient.methodName||"")}</span></div><div class="receipt-box"><b>Compte Flick-exchange</b><span>${esc(a.holderName)}<br>${esc(a.methodName)}<br>${esc(a.phone)}${a.cardOrAccount?`<br>${esc(a.cardOrAccount)}`:""}</span></div><div class="receipt-box"><b>Délai estimé</b><span>${APP_CONFIG.transferDurationMinutes} minutes après confirmation admin<br>Statut : ${statusLabel(t.status)}</span></div><div class="receipt-box"><b>Taux appliqué</b><span>Brut : ${Number(t.exchangeRateRaw||t.rate||0).toFixed(6)}<br>Appliqué : ${Number(t.exchangeRateApplied||t.rate||0).toFixed(6)}<br>Source : ${esc(t.rateSource||"fallback")}</span></div><div class="receipt-box"><b>Preuves</b><span>${proofs.length} preuve(s) ajoutée(s)<br>${t.paymentDeclaredAt?`Paiement déclaré : ${fdate(t.paymentDeclaredAt)}`:"Paiement non déclaré"}</span></div></div><div class="receipt-total"><div class="line"><span>Montant envoyé</span><b>${money(t.amountSent,t.currencyFrom)}</b></div><div class="line"><span>Montant reçu estimé</span><b>${money(t.amountReceived,t.currencyTo)}</b></div><div class="line"><span>Frais ${t.feePercent||APP_CONFIG.feePercent}%</span><b>${money(t.fees,t.currencyFrom)}</b></div><div class="line total"><span>Total à payer</span><b>${money(t.totalToPay||Number(t.amountSent||0)+Number(t.fees||0),t.currencyFrom)}</b></div></div><div class="receipt-warning">Les informations de paiement, le réseau/banque de l’expéditeur, le numéro de transfert et le montant doivent être identiques. Toute différence peut retarder ou annuler le traitement.</div></div></section>`}
function loadHtml2Canvas(){return new Promise((resolve,reject)=>{if(window.html2canvas)return resolve(window.html2canvas);let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";s.onload=()=>resolve(window.html2canvas);s.onerror=()=>reject(new Error("html2canvas indisponible"));document.head.appendChild(s)})}
async function downloadReceiptImage(tid){let t=transferById(tid);if(!t)return;try{await loadHtml2Canvas();let node=document.getElementById("receiptPrintable");if(!node){msg("error","Reçu introuvable à convertir.");return}let canvas=await html2canvas(node,{scale:2,backgroundColor:"#ffffff",useCORS:true});let a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=`recu-${t.id}.png`;a.click();msg("success","Reçu téléchargé en image PNG.")}catch(e){msg("warning","Téléchargement image indisponible. Utilise l'impression PDF à la place.");printReceipt(tid)}}
function printReceipt(tid){let t=transferById(tid);if(!t)return;let w=window.open("","_blank");w.document.write(`<!doctype html><html><head><title>Reçu ${t.id}</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;padding:24px;color:#0f172a;background:#f8fafc}.receipt{max-width:780px;margin:auto;background:#fff;border:1px solid #dbe3ea;border-radius:26px;overflow:hidden}.receipt-top-band{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:20px}.receipt-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.receipt-logo{width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900}.receipt-status{padding:8px 11px;border-radius:999px;font-size:11px;font-weight:900;background:#fff}.receipt-body{padding:16px}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.receipt-box{border:1px solid #e2e8f0;border-radius:16px;padding:12px;background:#f8fafc;min-height:76px}.receipt-box b{display:block;margin-bottom:5px;font-size:11px;color:#64748b;text-transform:uppercase}.receipt-box span{font-size:13px;line-height:1.45;font-weight:700}.receipt-total{margin-top:12px;border-radius:18px;background:#0f172a;color:#fff;padding:14px}.receipt-total .line{display:flex;justify-content:space-between;margin:6px 0}.receipt-total .total{font-size:18px;font-weight:900;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}.receipt-warning{margin-top:12px;padding:12px;border-radius:16px;background:#dbeafe;color:#1e3a8a;font-size:12px}@media print{button{display:none}body{background:#fff;padding:0}.receipt{border:0;border-radius:0}}</style></head><body>${receiptHtml(t)}<button type="button" onclick="print()" style="margin:20px auto;display:block;padding:12px 18px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-weight:800">Imprimer / Enregistrer en PDF</button></body></html>`);w.document.close();w.focus()}

function receiptText(t){return`FLICK-EXCHANGE\nReçu de transfert\n\nID: ${t.id}\nDate: ${fdate(t.createdAt)}\nStatut: ${statusLabel(t.status)}\nExpéditeur: ${t.senderName} - ${t.senderPhone}\nDestinataire: ${t.recipient.fullName} - ${t.recipient.phone}\nDirection: ${t.direction}\nMontant envoyé: ${money(t.amountSent,t.currencyFrom)}\nMontant reçu: ${money(t.amountReceived,t.currencyTo)}\nFrais: ${money(t.fees,t.currencyFrom)}\nTaux: ${t.rate}`;}
function download(name,content,type="text/plain"){let a=document.createElement("a"),b=new Blob([content],{type});a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadReceipt(tid){let t=getTransfers().find(x=>x.id===tid);if(t)download(`recu-${t.id}.txt`,receiptText(t))}
async function shareReceipt(tid){let t=getTransfers().find(x=>x.id===tid);if(!t)return;let text=receiptText(t);if(navigator.share){try{await navigator.share({title:`Reçu ${t.id}`,text})}catch(e){}}else{navigator.clipboard?.writeText(text);msg("success","Reçu copié.");render()}}
function receiptButtons(t){return`<div class="row" style="margin-top:10px"><button type="button" class="btn btn-outline" onclick="event.stopPropagation();printReceipt('${t.id}')">PDF</button><button type="button" class="btn btn-soft" onclick="event.stopPropagation();downloadReceiptImage('${t.id}')">Image</button><button type="button" class="btn btn-primary" onclick="event.stopPropagation();shareReceipt('${t.id}')">Partager</button></div>`}
function exportCSV(){let u=getCurrentUser(),rows=getTransfers().filter(t=>t.userId===u.id).map(t=>[t.id,fdate(t.createdAt),t.direction,t.recipient.fullName,t.amountSent,t.currencyFrom,statusLabel(t.status),t.fees]);let csv=["ID,Date,Direction,Destinataire,Montant,Devise,Statut,Frais",...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))].join("\n");download("historique-flick-exchange.csv",csv,"text/csv")}
function accessDenied(){return`<section class="page">${empty("Accès refusé","Cette section est réservée aux administrateurs.")}<a class="btn btn-primary" style="margin-top:14px" href="${ROUTES.HOME}">Retour accueil</a></section>`}
function notFound(){return`<section class="page">${empty("Page introuvable","Route inconnue.")}<a class="btn btn-primary" style="margin-top:14px" href="${ROUTES.HOME}">Retour accueil</a></section>`}
function page(r){let map={[ROUTES.LOGIN]:pageLogin,[ROUTES.REGISTER]:pageRegister,[ROUTES.HOME]:pageHome,[ROUTES.CALCULATOR]:pageCalculator,[ROUTES.TRANSFER]:pageTransfer,[ROUTES.HISTORY]:pageHistory,[ROUTES.NOTIFICATIONS]:pageNotifications,[ROUTES.SUPPORT]:pageSupport,[ROUTES.PROFILE]:pageProfile,[ROUTES.SETTINGS]:pageSettings,[ROUTES.ADMIN]:pageAdmin,[ROUTES.ADMIN_TRANSFERS]:pageAdminTransfers,[ROUTES.TRANSFER_DETAIL]:pageTransferDetail};return(map[r]||notFound)()}
function render(){if(FEATURE_LEVEL>=19)expirePendingTransfers();let previousRoute=lastRenderedRoute;state.route=route();if(!authOk(state.route))return;document.getElementById("app").innerHTML=layout(state.route,page(state.route));if(previousRoute!==state.route){scrollTo({top:0,behavior:"auto"})}lastRenderedRoute=state.route;if(FEATURE_LEVEL>=49&&typeof v49AfterRender==="function")requestAnimationFrame(v49AfterRender)}
function init(){initStorage();addEventListener("hashchange",()=>{stopTransferCountdown();clearMsg();render();updateRateDom();updateCalculatorPreview();updateTransferAmountPreview()});if(!location.hash){location.hash=getCurrentUser()?ROUTES.HOME:ROUTES.LOGIN;render()}else render();refreshAllRates(false);startAutoRateRefresh();console.log("Flick-exchange initialisé — "+APP_VERSION)}
init();
</script>
</body>
</html>
