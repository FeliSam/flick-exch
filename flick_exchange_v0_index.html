<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Flick-exchange</title>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-soft: #ccfbf1;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      --radius-xl: 28px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(20, 184, 166, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.18), transparent 35%),
        var(--bg);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-card {
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 28px 22px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .welcome-card::before {
      content: "";
      position: absolute;
      inset: 0;
      height: 8px;
      background: linear-gradient(90deg, var(--primary), #14b8a6, #99f6e4);
    }

    .logo-circle {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      margin: 12px auto 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--primary), #14b8a6);
      color: white;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      box-shadow: 0 16px 32px rgba(15, 118, 110, 0.28);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 20px 0 24px;
      text-align: left;
    }

    .info-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #f8fafc;
      font-size: 14px;
      color: var(--muted);
    }

    .info-item strong {
      display: block;
      color: var(--text);
      margin-bottom: 4px;
    }

    .primary-button {
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(15, 118, 110, 0.26);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .primary-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    .version-note {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 360px) {
      .app-shell {
        padding: 16px 12px;
      }

      .welcome-card {
        padding: 24px 16px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const APP_VERSION = "0.0.0";

    function renderBase() {
      const app = document.getElementById("app");

      app.innerHTML = `
        <main class="app-shell">
          <section class="welcome-card" aria-label="Écran initial Flick-exchange">
            <div class="logo-circle" aria-hidden="true">FX</div>

            <div class="badge">
              ✅ Version 0 — Base initiale
            </div>

            <h1>Flick-exchange</h1>

            <p class="subtitle">
              Application mobile-first de transfert d'argent entre le Bénin et la Russie.
              Cette première version prépare uniquement la base HTML, CSS et JavaScript.
            </p>

            <div class="info-grid">
              <div class="info-item">
                <strong>Stack</strong>
                HTML + CSS + JavaScript vanilla
              </div>

              <div class="info-item">
                <strong>Architecture</strong>
                Tout le code dans un seul fichier index.html
              </div>

              <div class="info-item">
                <strong>Prochaine étape</strong>
                Ajouter le routeur hash, le header, la bottom navigation et les pages statiques.
              </div>
            </div>

            <button class="primary-button" type="button" aria-label="Bouton visuel non fonctionnel">
              Commencer
            </button>

            <p class="version-note">
              Flick-exchange initialisé — v${APP_VERSION}
            </p>
          </section>
        </main>
      `;
    }

    function initApp() {
      renderBase();
      console.log("Flick-exchange initialisé — Version 0");
    }

    initApp();
  </script>
</body>
</html>
